<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verset Conferință</title>
    
    <!-- Rutas relativas estándar para páginas estáticas -->
    <link href="./static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Keep the image static */
            
            /* Make it ocuppy 100% the height and width */
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden; /* Avoid overflow */
        }
    </style>

    <!-- Script principal que hace todo el trabajo al cargar la página -->
    <script>
        async function displayRandomItem() {
            try {
                // 1. Cargar el JSON mediante fetch (ruta relativa)
                const response = await fetch("configuration/versete_imagini.json");
                const items = await response.json();

                // 2. Elegir un elemento aleatorio del array
                const randomItem = items[Math.floor(Math.random() * items.length)];
                const path = "./static/img/" + randomItem.photo
                console.log("Seleccionado:", path);

                document.getElementById(elementId="main_body").style.backgroundImage = `url('${path}')`;

                //return path

            } catch (error) {
                console.error("Error al cargar el archivo JSON:", error);
            }
        }

        // Ejecutar la función automáticamente al abrir la página
        //displayRandomItem();
        window.addEventListener("DOMContentLoaded", displayRandomItem);
    </script>
</head>
<body id="main_body" class="d-flex justify-content-center align-items-center min-vh-100 m-0">
    
    
    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="./static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
