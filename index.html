<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verset Conferință</title>
    
    <link href="./static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            background-color: #000;

            display: flex;

            padding: 20px;

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        .content-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .footer-link {
            position: absolute;
            bottom: 23%; /* Distancia desde la parte inferior de la pantalla */
            left: 50%;
            transform: translateX(-50%); /* Lo centra perfectamente de forma horizontal */
            z-index: 1;
        }
        
    </style>

    <script>

        async function displayRandomItem() {

            let items = [];

            for (let i = 0; i < 46; i++) {
                let j = i + 1;
                items[i] = { photo: j + ".webp" };
            }

            const randomItem = items[Math.floor(Math.random() * items.length)];
            const path = "./static/img/" + randomItem.photo;

            // Optimization trick: preload the image in the page
            const img = new Image();
            img.src = path;
            img.onload = function() {
                // Show the background only when the image is fully downloaded
                document.getElementById("main_body").style.backgroundImage = `url('${path}')`;
            };
            
        }

        window.addEventListener("DOMContentLoaded", displayRandomItem);
    </script>
</head>
<body id="main_body" class="d-flex justify-content-center align-items-center min-vh-100 m-0">

    <!-- Espacio superior vacío para equilibrar el diseño con Flexbox -->
    <div class="content-container"></div>


    <!-- Contenedor inferior para el enlace de Instagram -->
    <div class="footer-link d-flex align-items-center justify-content-center">
        <a href="https://www.instagram.com/tinerimaranatalogrono/" target="_blank" class="mx-5" >
             <img src="./static/img/insta-icon.webp" style="width: 43px; height: 43px;">
        </a>

        <!-- <a href="https://forms.gle/CGTueKWsPc1dVuT76" target="_blank" class="mx-5" >
             <img src="./static/img/encuesta-icon.webp" style="width: 43px; height: 43px;">
        </a> -->
    </div>
    
    <script src="./static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
