<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verset Conferință</title>
    
    <link href="./static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
    </style>

    <script>
        async function displayRandomItem() {

            let items = [];

            for (let i = 0; i < 47; i++) {
                let j = i + 1;
                items[i] = { photo: j + ".png" };
            }

            const randomItem = items[Math.floor(Math.random() * items.length)];
            const path = "./static/img/" + randomItem.photo;

            // Optimization trick: preload the image in the page
            const img = new Image();
            img.src = path;
            img.onload = function() {
                // Show the background only when the image is fully downloaded
                document.getElementById("main_body").style.backgroundImage = `url('${path}')`;
            };
            
        }

        window.addEventListener("DOMContentLoaded", displayRandomItem);
    </script>
</head>
<body id="main_body" class="d-flex justify-content-center align-items-center min-vh-100 m-0">
    
    <script src="./static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
