<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verset Biblic Conferință</title>
    
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        .verse-text {
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.6;
            color: #2c3e50;
        }
        .verse-ref {
            font-weight: 600;
            color: #7f8c8d;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 m-0" style="background-color: #666155 !important;">

    
    <div class="container px-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                
                <div class="card shadow-lg border-0 rounded-4 p-4 text-center bg-white">
                    <div class="card-body">
                        <!-- Verse text -->
                        <p class="verse-text mb-4">"{{ data.text }}"</p>
                        
                        <!-- Verse reference -->
                        <h4 class="verse-ref mb-0">— {{ data.trimitere }}</h4>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
